<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- lib arm renderer: one library model, mounted by the library's own engine (kit/build.js). -->
<link rel="stylesheet" href="file:///Users/gregwallace/Documents/experiments/ai-teacher/scratchpad/quality-prd/research/animated-models/library/kit/tokens.css">
<style>body{margin:0;background:#fff}#host{width:1280px}</style>
</head><body><div id="host"></div>
<script type="module">
const LIB = 'file:///Users/gregwallace/Documents/experiments/ai-teacher/scratchpad/quality-prd/research/animated-models/library';
const { mountSlide, fontsReady } = await import(`${LIB}/kit/build.js`);
const host = document.getElementById('host');
let stage;
const DRAW = 'text,rect,circle,ellipse,path,line,polyline,polygon,image,use';
window.LIBR = {
  async render(id, params, theme) {
    const m = await import(`${LIB}/models/${id}.js`);
    if (stage) stage.destroy();
    host.textContent = '';
    stage = mountSlide(host, m, params, { theme });
    await fontsReady();
    stage.update(params, theme);
    return { N: stage.N, warnings: stage.warnings || [] };
  },
  show(k) { stage.show(k, true); return stage.warnings || []; },
  /** Where the drawing is on the slide (CSS px from the slide's corner), padded: the figure zone's crop. */
  bbox(pad = 18) {
    const sr = stage.slide.getBoundingClientRect();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const el of stage.svg.querySelectorAll(DRAW)) {
      if (el.closest('defs,clipPath,mask,marker,pattern,symbol,.off') || el.classList.contains('grain')) continue;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) continue;
      if (r.width >= sr.width - 1) continue; // full-width grounds and rules are not the drawing's edge
      if (getComputedStyle(el).opacity === '0' || getComputedStyle(el).visibility === 'hidden') continue;
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    }
    if (!Number.isFinite(x0)) return { x: 0, y: 0, w: sr.width, h: sr.height };
    x0 = Math.max(sr.left, x0 - pad); y0 = Math.max(sr.top, y0 - pad);
    x1 = Math.min(sr.right, x1 + pad); y1 = Math.min(sr.bottom, y1 + pad);
    return { x: x0 - sr.left, y: y0 - sr.top, w: x1 - x0, h: y1 - y0 };
  },
};
document.documentElement.dataset.ready = '1';
</script></body></html>
