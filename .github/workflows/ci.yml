# CI (TEACH-23). Reproduce every job locally with the commands in README "CI".
#
# Every third-party action is pinned to a full commit SHA; the trailing comment is the tag it was
# resolved from. Update the SHA and the comment together (Dependabot opens those PRs).

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  detect:
    # hashFiles() is not available in job-level `if`, so presence checks run once here and the
    # optional jobs key off these outputs.
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.probe.outputs.web }}
      dockerfile: ${{ steps.probe.outputs.dockerfile }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is the base branch tip,
          # so `HEAD^1..HEAD` is exactly what the PR changes.
          fetch-depth: 2
      - id: probe
        run: |
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f Dockerfile ] && echo "dockerfile=true" >> "$GITHUB_OUTPUT" || echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # The script imports only Bun built-ins, so Bun is enough; no `bun install`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request'
        with:
          bun-version-file: .bun-version

      # A PR that changes only documentation skips the e2e shards (scripts/e2e-scope.ts); a push to
      # master always runs them. An unreadable diff reaches the script as empty input: e2e runs.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD | bun scripts/e2e-scope.ts >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: bun run lint
        run: bun run lint

      - name: homepage source and generated links
        run: bun run homepage:lint && bun run homepage:check:site && bun run homepage:check

      - name: bun run typecheck
        run: bun run typecheck

      - name: bun run skills:check
        run: bun run skills:check

      - name: bun run env:generate --check (docs/env.md, .env.example, .gitleaks.toml in sync with infra/env.contract.ts)
        run: bun run env:generate --check

      - name: bun run verify-bootstrap
        run: bun run verify-bootstrap

      - name: commitlint the PR title (squash merges use it as the commit subject)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint --verbose

  tooling-smoke:
    name: tooling-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Root scripts derive DATABASE_URL / TEST_DATABASE_URL from this port.
      TJ_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: bun run setup --ci
        run: bun run setup --ci

      - name: bun run doctor
        run: bun run doctor

      - name: bun run test:scripts
        run: bun run test:scripts

      - name: docker compose down
        if: always()
        run: docker compose down -v --remove-orphans

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_journey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres -d teaching_journey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_journey
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_journey_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Create the test database (mirrors infra/postgres/init)
        run: |
          psql -h localhost -U postgres -d teaching_journey -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE teaching_journey_test;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U postgres -d teaching_journey_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # `test:db` under CI=true skips docker compose (Postgres is the job service above), migrates
      # both databases and runs `turbo run test` with REQUIRE_TEST_DB=1 so a DB suite that cannot
      # connect fails instead of skipping (docs/testing.md).
      - name: bun run test:db
        run: bun run test:db

      # The free half of the F06 eval set (ADR 0025 §23, docs/eval.md): twelve briefs through the
      # pipeline on the scripted fake, then the schema checks. No network, no model, < 30 s.
      - name: bun run eval:schema
        run: bun run eval:schema

      - name: Upload coverage
        if: always() && hashFiles('**/coverage/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            **/coverage/**
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # sticky bundle-budget comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: bun run build
        run: bun run build

      - name: Stage homepage into the production web output
        run: bun run homepage:stage

      - name: Bundle budget (F18-R05, 250 KB gzip)
        id: budget
        run: |
          if [ -f apps/web/dist/.vite/manifest.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Bundle budget: skipped — apps/web/dist/.vite/manifest.json not found (TEACH-21)"
          fi
          # Always writes bundle-budget.md (skip notice or report); exits 1 above the budget.
          set +e
          bun run check:bundle-budget --markdown-out bundle-budget.md
          status=$?
          set -e
          cat bundle-budget.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Sticky bundle-budget PR comment
        if: always() && github.event_name == 'pull_request' && steps.budget.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- tj-bundle-budget -->'
          body="$(printf '%s\n%s\n' "$marker" "$(cat bundle-budget.md)")"
          existing="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            echo "created comment"
          fi

  e2e-shard:
    # Playwright (apps/web/e2e, TEACH-22) in four shards that run at once (TEACH-190 part b). Not a
    # required check itself: the `e2e` job below reports for all four.
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.e2e == 'true'
    strategy:
      # Let every shard finish, so a failure in one still leaves the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_journey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres -d teaching_journey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # playwright.config.ts boots api + worker against this database and migrates it first.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_journey_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Create the test database (mirrors infra/postgres/init)
        run: |
          psql -h localhost -U postgres -d teaching_journey -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE teaching_journey_test;"
          psql -h localhost -U postgres -d teaching_journey_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Run from apps/web so `bunx` resolves the pinned `@playwright/test` (isolated linker: the
      # root has no node_modules/.bin), instead of fetching whatever is latest on npm. A latest
      # resolution both misses the browser cache and downloads a Chromium build the pinned
      # runner cannot use.
      - name: Playwright version
        id: pw
        working-directory: apps/web
        run: |
          version="$(bunx --bun playwright --version 2>/dev/null | awk '{print $2}' || echo unknown)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--bun` everywhere Playwright is invoked: the whole toolchain runs on Bun, no Node (ADR 0014).
      # Headless runs use Chromium's headless shell, so the full browser is never downloaded.
      - name: Install Chromium
        working-directory: apps/web
        run: bunx --bun playwright install --with-deps --only-shell chromium

      # Straight to Playwright, not `bun run test:e2e` at the root: turbo would first build every
      # package, and the suite runs api and worker from source and builds web itself (`webServer`).
      # The `build` job checks the build.
      - name: Playwright shard ${{ matrix.shard }}/4
        working-directory: apps/web
        run: bun run test:e2e --shard=${{ matrix.shard }}/4

      # A blob report carries the traces and screenshots; the `e2e` job merges them.
      - name: Upload the shard's blob report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # The required check (README "CI"). It passes when every shard passed, or when `detect` skipped
    # them all (no web app, or a docs-only PR). `if: always()` matters: GitHub counts a skipped
    # required check as passing, so without it a failed shard would skip this job and let the PR
    # merge. For the same reason a failed `detect`, which skips the shards, fails it.
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect, e2e-shard]
    if: always()
    steps:
      # On a failure, one HTML report from the failed shards' blob reports.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.e2e-shard.result == 'failure'
      - uses: ./.github/actions/setup
        if: needs.e2e-shard.result == 'failure'
      - name: Download the shards' blob reports
        if: needs.e2e-shard.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        if: needs.e2e-shard.result == 'failure'
        working-directory: apps/web
        run: bunx --bun playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright report
        if: needs.e2e-shard.result == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Verdict
        if: always()
        env:
          DETECT: ${{ needs.detect.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "detect: $DETECT, e2e shards: $SHARDS"
          if [ "$DETECT" = "success" ] && { [ "$SHARDS" = "success" ] || [ "$SHARDS" = "skipped" ]; }; then
            exit 0
          fi
          echo "::error title=e2e::detect is '$DETECT' and the e2e shards are '$SHARDS'; e2e needs detect to succeed and the shards to pass or be skipped"
          exit 1

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Advisories both audit paths skip, as "<GHSA id>:<last day skipped, YYYY-MM-DD>", one reason
      # each below. After the date the advisory fails the job again: look for a fixed release.
      # - GHSA-vfj7-8cjw-p6xm, braces <=3.0.3, no fixed release on 8 Oct 2026. A stack-exhaustion
      #   DoS from attacker-supplied glob patterns; braces comes only through the `mastra` dev CLI
      #   behind `bun run studio:generation`, which runs locally against our own files.
      AUDIT_IGNORE: GHSA-vfj7-8cjw-p6xm:2027-01-08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Advisory exemptions
        run: |
          today="$(date -u +%F)"
          ids=""
          for entry in $AUDIT_IGNORE; do
            # A malformed date would compare as never expired, so refuse it instead.
            if [[ ! "$entry" =~ ^GHSA(-[0-9a-z]{4}){3}:[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error title=audit exemption::malformed AUDIT_IGNORE entry '$entry'; expected <GHSA id>:<YYYY-MM-DD>"
              exit 1
            fi
            id="${entry%%:*}"
            until="${entry#*:}"
            if [[ "$today" > "$until" ]]; then
              echo "::warning title=audit exemption expired::$id was skipped until $until and counts again"
            else
              echo "::notice title=audit exemption::$id skipped until $until (reason in ci.yml)"
              ids="$ids $id"
            fi
          done
          echo "IGNORE_IDS=${ids# }" >> "$GITHUB_ENV"

      - name: bun audit --audit-level=high
        id: bun_audit
        # Native in Bun >= 1.2.15 (verified on 1.3.6); exits 1 when advisories >= high exist. It
        # talks to npm's bulk-advisory endpoint, which has outages ("ConnectionClosed: audit request
        # failed" after minutes of hanging). Classify the outcome so an outage falls through to the
        # OSV fallback below instead of turning the job red or, worse, silently green.
        run: |
          ignore=()
          for id in $IGNORE_IDS; do ignore+=("--ignore=$id"); done
          set +e
          output="$(timeout 120 bun audit --audit-level=high "${ignore[@]}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 124 ] || printf '%s' "$output" | grep -qi "audit request failed"; then
            echo "::warning title=bun audit unavailable::npm advisory endpoint unreachable (exit $code); falling back to osv-scanner"
            echo "result=unavailable" >> "$GITHUB_OUTPUT"
          else
            echo "result=vulnerable" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      - name: Fallback -- osv-scanner on bun.lock (high/critical only)
        if: steps.bun_audit.outputs.result == 'unavailable'
        # OSV.dev mirrors the GitHub Advisory Database and is independent of npm's endpoint.
        # osv-scanner exits 1 on ANY finding, so filter to >= high ourselves. Image pinned by digest.
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            --lockfile=bun.lock --format json > osv.json # v2.5.1
          code=$?
          set -e
          # osv-scanner v2: 0 = clean, 1 = findings; anything else = scanner/network error -> fail loudly.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error title=audit::osv-scanner failed (exit $code); dependency audit could not run"
            exit 1
          fi
          jq -e '.results' osv.json >/dev/null || { echo "::error title=audit::osv-scanner produced no results"; exit 1; }
          jq -r --arg ignore "$IGNORE_IDS" '($ignore | split(" ")) as $skip |
                  [.results[]?.packages[]? | .package as $p | .vulnerabilities[]? |
                  select([.id] + (.aliases // []) | any(.[]; IN($skip[])) | not) |
                  "\(.database_specific.severity // "UNKNOWN")\t\(.id)\t\($p.name)@\($p.version)"] | .[]' osv.json \
            | sort | tee osv-summary.tsv
          high="$(awk -F'\t' '$1=="HIGH" || $1=="CRITICAL" || $1=="UNKNOWN"' osv-summary.tsv | wc -l | tr -d ' ')"
          if [ "$high" -gt 0 ]; then
            echo "::error title=audit::$high high/critical (or unrated) advisories in bun.lock (osv-scanner)"
            exit 1
          fi
          echo "audit: no high/critical advisories (osv-scanner fallback; $(wc -l < osv-summary.tsv | tr -d ' ') lower-severity findings listed above)"

      - name: Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks comments on the offending PR lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history of the branch, not just the merge commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organisation-owned repos; OmerBresinski/ai-teacher is a personal
          # account, so this is empty and unused (README "CI").
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker-build-smoke:
    name: docker-build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No Dockerfile yet; TEACH-16/17 (api/worker on Railway, ADR 0010) add one.
    needs: detect
    if: needs.detect.outputs.dockerfile == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build .
        run: docker build .
