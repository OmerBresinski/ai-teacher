name: Setup Bun
description: Install the pinned Bun (.bun-version), restore the install cache and run a frozen install.

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    # Node is only needed to host Vitest (apps/web, packages/ui); everything else runs on Bun.
    # Pinning it here keeps CI aligned with .nvmrc instead of the runner image default.
    - name: Install Node (Vitest host, .nvmrc)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Restore Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: bun install --frozen-lockfile
      shell: bash
      run: bun install --frozen-lockfile
