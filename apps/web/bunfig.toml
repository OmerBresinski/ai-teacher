# `bun test` for @tj/web (ADR 0014, amended): happy-dom + Testing Library via the shared preloads,
# then the workspace preload that pins `VITE_*` for `src/env.ts`. Order matters: the DOM must exist
# before `@testing-library/react` is imported. `[install]` is not repeated here: Bun reads install
# settings from the workspace root's bunfig.toml (`exact = true`).
[test]
# Only `src/**` -- Playwright owns `e2e/**/*.spec.ts` (docs/testing.md naming rule).
root = "src"
preload = ["@tj/config/bun-test/dom", "@tj/config/bun-test/setup", "./bun-test.setup.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
